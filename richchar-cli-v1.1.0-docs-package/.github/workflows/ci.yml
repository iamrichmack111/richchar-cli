name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install QA tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n richchar scripts/doctor.sh
      - name: ShellCheck
        run: shellcheck richchar scripts/doctor.sh
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: CLI smoke
        run: |
          ./richchar --version
          ./richchar --help >/dev/null
